<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1f2937; }
      .subtitle { font: 400 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #6b7280; }
      .group-title { font: 700 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1f2937; }
      .uc-text { font: 400 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #374151; }
      .actor-text { font: 700 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1f2937; }
      .note-text { font: 400 13px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #6b7280; }
      .sys-border { fill: #ffffff; stroke: #b8c6db; stroke-width: 2.5; }
      .panel-a { fill: #eef5ff; stroke: #c9d8ee; stroke-width: 2; }
      .panel-b { fill: #f2fbf4; stroke: #cfe5d4; stroke-width: 2; }
      .panel-c { fill: #fff8ec; stroke: #eedfb9; stroke-width: 2; }
      .panel-d { fill: #f4f7ff; stroke: #d6ddf5; stroke-width: 2; }
      .usecase { fill: #ffffff; stroke: #5d84c3; stroke-width: 2.2; }
      .line { stroke: #6b8ec6; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#ffffff"/>

  <text x="900" y="54" text-anchor="middle" class="title">社区“智慧助老”服务对接平台系统用例图</text>

  <rect x="210" y="120" rx="20" ry="20" width="1560" height="980" class="sys-border"/>
  <text x="990" y="150" text-anchor="middle" class="group-title">社区“智慧助老”服务对接平台</text>

  <rect x="320" y="190" rx="16" ry="16" width="1180" height="170" class="panel-a"/>
  <text x="910" y="214" text-anchor="middle" class="group-title">老人/家属端用例</text>

  <rect x="320" y="410" rx="16" ry="16" width="1180" height="170" class="panel-b"/>
  <text x="910" y="434" text-anchor="middle" class="group-title">共享沟通与协同用例</text>

  <rect x="320" y="630" rx="16" ry="16" width="1180" height="160" class="panel-c"/>
  <text x="910" y="654" text-anchor="middle" class="group-title">志愿者端用例</text>

  <rect x="320" y="830" rx="16" ry="16" width="1180" height="140" class="panel-d"/>
  <text x="910" y="854" text-anchor="middle" class="group-title">管理员端用例</text>


  <!-- use cases -->
  <ellipse cx="540" cy="270" rx="130" ry="34" class="usecase"/>
  <text x="540" y="277" text-anchor="middle" class="uc-text">注册登录</text>

  <ellipse cx="875" cy="270" rx="145" ry="34" class="usecase"/>
  <text x="875" y="277" text-anchor="middle" class="uc-text">维护老人档案</text>

  <ellipse cx="1220" cy="270" rx="150" ry="34" class="usecase"/>
  <text x="1220" y="277" text-anchor="middle" class="uc-text">发布服务需求</text>

  <ellipse cx="640" cy="495" rx="145" ry="34" class="usecase"/>
  <text x="640" y="502" text-anchor="middle" class="uc-text">查看订单进度</text>

  <ellipse cx="960" cy="495" rx="145" ry="34" class="usecase"/>
  <text x="960" y="502" text-anchor="middle" class="uc-text">双端实时聊天</text>

  <ellipse cx="1290" cy="495" rx="145" ry="34" class="usecase"/>
  <text x="1290" y="502" text-anchor="middle" class="uc-text">评价反馈</text>

  <ellipse cx="960" cy="720" rx="220" ry="38" class="usecase"/>
  <text x="960" y="727" text-anchor="middle" class="uc-text">地图接单、服务执行与积分</text>

  <ellipse cx="590" cy="910" rx="150" ry="34" class="usecase"/>
  <text x="590" y="917" text-anchor="middle" class="uc-text">用户/志愿者审核</text>

  <ellipse cx="910" cy="910" rx="175" ry="34" class="usecase"/>
  <text x="910" y="917" text-anchor="middle" class="uc-text">需求审核与工单调度</text>

  <ellipse cx="1260" cy="910" rx="145" ry="34" class="usecase"/>
  <text x="1260" y="917" text-anchor="middle" class="uc-text">数据统计分析</text>

  <!-- actors -->
  <g class="line">
    <circle cx="80" cy="265" r="24"/>
    <line x1="80" y1="289" x2="80" y2="360"/>
    <line x1="48" y1="315" x2="112" y2="315"/>
    <line x1="80" y1="360" x2="50" y2="410"/>
    <line x1="80" y1="360" x2="110" y2="410"/>
  </g>
  <text x="80" y="440" text-anchor="middle" class="actor-text">老人/家属</text>

  <g class="line">
    <circle cx="80" cy="850" r="24"/>
    <line x1="80" y1="874" x2="80" y2="945"/>
    <line x1="48" y1="900" x2="112" y2="900"/>
    <line x1="80" y1="945" x2="50" y2="995"/>
    <line x1="80" y1="945" x2="110" y2="995"/>
  </g>
  <text x="80" y="1025" text-anchor="middle" class="actor-text">管理员</text>

  <g class="line">
    <circle cx="1670" cy="510" r="24"/>
    <line x1="1670" y1="534" x2="1670" y2="605"/>
    <line x1="1638" y1="560" x2="1702" y2="560"/>
    <line x1="1670" y1="605" x2="1640" y2="655"/>
    <line x1="1670" y1="605" x2="1700" y2="655"/>
  </g>
  <text x="1670" y="685" text-anchor="middle" class="actor-text">志愿者</text>

  <!-- left actor lines elderly -->
  <path d="M115 270 H365 V278 H410" class="line"/>
  <path d="M115 288 H690 V270 H730" class="line"/>
  <path d="M115 306 H1040 V270 H1070" class="line"/>
  <path d="M115 324 H320 V495 H495" class="line"/>
  <path d="M115 342 H780 V495 H815" class="line"/>
  <path d="M115 360 H320 V455 H495" class="line"/>

  <!-- right actor lines volunteer -->
  <path d="M1645 492 H1435" class="line"/>
  <path d="M1645 510 H1500 V495 H1435" class="line"/>
  <path d="M1645 528 H1500 V720 H1180" class="line"/>

  <!-- left actor lines admin -->
  <path d="M115 855 H420 V910 H440" class="line"/>
  <path d="M115 873 H715 V910 H735" class="line"/>
  <path d="M115 891 H1080 V910 H1115" class="line"/>

  <!-- shared internal flows -->
  <path d="M670 270 H730" class="line"/>
  <path d="M1020 270 H1070" class="line"/>
  <path d="M785 495 H815" class="line"/>
  <path d="M1105 495 H1145" class="line"/>

  <!-- cross-layer coordination -->
  <path d="M640 529 V720 H740" class="line"/>
  <path d="M960 529 V682" class="line"/>
  <path d="M1220 304 V495 H1105" class="line"/>
  <path d="M1290 529 V720 H1180" class="line"/>
  <path d="M910 876 V720 H910" class="line"/>
</svg>
